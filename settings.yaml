apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-retypeset-setting
spec:
  forms:
    - group: general
      label: 常规设置
      formSchema:
        - $formkit: select
          name: language
          label: 界面语言
          value: zh
          options:
            - label: 简体中文
              value: zh
            - label: English
              value: en
        - $formkit: select
          name: color_mode
          label: 默认配色
          value: system
          options:
            - label: 跟随系统
              value: system
            - label: 深色
              value: dark
            - label: 浅色
              value: light
        - $formkit: select
          name: font_style
          label: 字体样式
          value: sans
          options:
            - label: 无衬线体
              value: sans
            - label: 衬线体
              value: serif

        - $formkit: select
          name: logo_type
          label: 站点标识
          value: text
          options:
            - label: 站点名称
              value: text
            - label: Logo 图片
              value: image

        - $formkit: select
          name: layout_direction
          label: 侧边栏位置
          value: right
          options:
            - label: 右侧（默认）
              value: right
            - label: 左侧
              value: left

        - $formkit: number
          name: content_max_width
          label: 正文最大宽度
          value: 52
          min: 44
          max: 64
          step: 0.5
          help: 控制桌面端正文最大宽度，单位 rem；目录仍按原位置计算

        - $formkit: select
          name: toc_desktop_mode
          label: 桌面端目录模式
          value: collapsible
          options:
            - label: 常显
              value: "always"
            - label: 收缩（默认展开，点击收缩）
              value: "collapsible"
            - label: 关闭
              value: "off"

        - $formkit: select
          name: toc_mobile_mode
          label: 移动端目录模式
          value: "accordion"
          options:
            - label: 顶部手风琴
              value: "accordion"
            - label: 侧边目录
              value: "sidebar"
            - label: 关闭
              value: "off"

        - $formkit: text
          name: icp_number
          label: ICP 备案号
          value: ""
          help: 填写后将在页脚展示，留空则不展示

    - group: appearance
      label: 外观配色
      formSchema:
        - $formkit: checkbox
          name: enable_custom_colors
          label: 启用自定义颜色
          value: false
          help: 开启后将覆盖主题内置的浅色和深色配色

        - $formkit: color
          name: light_primary
          label: 浅色主文字色
          value: "#403d42"
        - $formkit: color
          name: light_secondary
          label: 浅色次文字色
          value: "#625d66"
        - $formkit: color
          name: light_background
          label: 浅色背景色
          value: "#f5f3f6"
        - $formkit: color
          name: light_highlight
          label: 浅色标记色
          value: "#f5d94f"

        - $formkit: color
          name: dark_primary
          label: 深色主文字色
          value: "#ece9ef"
        - $formkit: color
          name: dark_secondary
          label: 深色次文字色
          value: "#c2bdc6"
        - $formkit: color
          name: dark_background
          label: 深色背景色
          value: "#302d33"
        - $formkit: color
          name: dark_highlight
          label: 深色标记色
          value: "#f5d94f"

    - group: sidebar
      label: 侧边栏
      formSchema:
        - $formkit: number
          name: desktop_offset
          label: 桌面侧边栏间距
          value: 11.25
          min: 0
          step: 0.25
          help: 控制侧边栏与正文之间的水平距离，单位 rem，默认 11.25
        - $formkit: checkbox
          name: show_site_header
          label: 显示站点标题
          value: true
        - $formkit: checkbox
          name: show_site_subtitle
          label: 显示站点副标题
          value: true
        - $formkit: select
          name: navigation_mode
          label: 导航链接
          value: default
          options:
            - label: 默认导航
              value: default
            - label: 自定义导航
              value: custom
            - label: 默认 + 自定义
              value: combined
            - label: 关闭导航
              value: "off"
        - $formkit: array
          name: custom_links
          label: 自定义导航链接
          value: []
          addLabel: 添加链接
          itemLabels:
            - type: text
              label: $value.name
          children:
            - $formkit: checkbox
              name: enabled
              label: 启用
              value: true
            - $formkit: text
              name: name
              label: 名称
              value: ""
            - $formkit: text
              name: url
              label: 链接
              value: ""
            - $formkit: checkbox
              name: new_window
              label: 新窗口打开
              value: false
        - $formkit: checkbox
          name: show_footer
          label: 显示侧边栏底部
          value: true
        - $formkit: checkbox
          name: show_social_links
          label: 显示社交链接
          value: true
        - $formkit: checkbox
          name: show_copyright
          label: 显示版权信息
          value: true
        - $formkit: checkbox
          name: show_icp
          label: 显示 ICP 备案号
          value: true
        - $formkit: checkbox
          name: show_powered_by
          label: 显示 Powered by
          value: true

    - group: social
      label: 社交链接
      formSchema:
        - $formkit: array
          name: social_links
          label: 社交链接
          value: []
          addLabel: 添加社交链接
          itemLabels:
            - type: text
              label: $value.name
          children:
            - $formkit: text
              name: name
              label: 名称
              value: ""
            - $formkit: text
              name: url
              label: 链接
              value: ""

    - group: advanced
      label: 高级设置
      formSchema:
        - $formkit: checkbox
          name: enable_transition
          label: 启用页面过渡动画
          value: true
          help: 页面间丝滑过渡切换，支持交叉淡入淡出和元素形变动画
        - $formkit: textarea
          name: custom_css
          label: 自定义 CSS
          rows: 5
          value: ""
        - $formkit: textarea
          name: custom_head
          label: 自定义 Head 元素
          rows: 3
          value: ""
