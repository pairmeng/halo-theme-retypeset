<!-- Button - matches original Button.astro -->
<th:block th:fragment="button">
  <div
    class="layout-flip-buttons absolute right-7.25vw top-14.6 flex gap-6 min-[823px]:max-lg:right-[calc(50vw-22rem)]"
    lg="fixed bottom-[min(10.27rem+1.92vw,12rem)] right-[max(5rem,calc(50vw-35rem))] top-auto w-14rem"
  >
    <!-- Scroll to Top (hidden by default, shown on scroll) -->
    <button
      id="scroll-top-button"
      class="aspect-square w-4 c-secondary op-0 pointer-events-none transition-opacity duration-300 active:scale-90! hover:c-primary"
      th:aria-label="${t_scroll_top}"
    >
      <svg aria-hidden="true" fill="currentColor" viewBox="0 0 24 24">
        <path d="M13 7.828V20h-2V7.828l-5.364 5.364-1.414-1.414L12 4l7.778 7.778-1.414 1.414L13 7.828Z" />
      </svg>
    </button>

    <!-- Search (conditional on plugin) -->
    <button
      th:if="${pluginFinder.available('PluginSearchWidget')}"
      id="search-button"
      class="aspect-square w-4 c-secondary active:scale-90! hover:c-primary"
      th:aria-label="${t_search}"
    >
      <svg aria-hidden="true" fill="currentColor" viewBox="0 0 24 24">
        <path d="M18.031 16.617 22.314 20.9l-1.414 1.414-4.283-4.283A8.96 8.96 0 0 1 11 20c-4.968 0-9-4.032-9-9s4.032-9 9-9 9 4.032 9 9a8.96 8.96 0 0 1-1.969 5.617ZM16.025 15.875A6.98 6.98 0 0 0 18 11c0-3.868-3.133-7-7-7-3.868 0-7 3.132-7 7 0 3.867 3.132 7 7 7a6.98 6.98 0 0 0 4.875-1.975l.15-.15Z" />
      </svg>
    </button>

    <!-- Theme Toggle -->
    <button
      id="theme-toggle-button"
      class="aspect-square w-4 c-secondary active:scale-90! hover:c-primary"
      th:aria-label="${t_switch_theme}"
    >
      <svg aria-hidden="true" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.51472 4.92893L4.92893 3.51472L7.05025 5.63604L5.63604 7.05025L3.51472 4.92893ZM16.9497 18.364L18.364 16.9497L20.4853 19.0711L19.0711 20.4853L16.9497 18.364ZM19.0711 3.51472L20.4853 4.92893L18.364 7.05025L16.9497 5.63604L19.0711 3.51472ZM5.63604 16.9497L7.05025 18.364L4.92893 20.4853L3.51472 19.0711L5.63604 16.9497ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z" />
      </svg>
    </button>
  </div>
</th:block>
