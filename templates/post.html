<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{modules/layout :: html(title = ${post.spec.title} + ' - ' + ${site.title}, content = ~{::content}, head = null, footer = null, sidebar = null, contentClass = '', isPostPage = true)}"
>
  <th:block th:fragment="content">
    <article class="heti" th:data-post-name="${post.metadata.name}">
      <!-- Back Button + Title wrapper (matching original) -->
      <div class="relative">
        <!-- Go Back Button (desktop only) -->
        <button
          id="back-button"
          class="hidden"
          lg="absolute left--10 top-3.8 block aspect-square w-4.5 c-secondary/60 transition-colors ease-out hover:c-primary active:scale-90!"
          type="button"
          th:aria-label="${t_go_back}"
        >
          <svg aria-hidden="true" fill="currentColor" viewBox="0 0 24 24">
            <path d="M7.82843 10.9999H20V12.9999H7.82843L13.1924 18.3638L11.7782 19.778L4 11.9999L11.7782 4.22168L13.1924 5.63589L7.82843 10.9999Z" />
          </svg>
        </button>
        <!-- Title -->
        <h1 class="post-title">
          <span th:text="${post.spec.title}"></span>
        </h1>
      </div>

      <!-- Date -->
      <div
        id="post-date"
        class="mb-17.2 block c-primary font-time"
      >
        <time
          th:datetime="${#dates.format(post.spec.publishTime, 'yyyy-MM-dd')}"
          th:text="${#dates.format(post.spec.publishTime, 'yyyy-MM-dd')}"
        ></time>
      </div>

      <!-- TOC (CSS-only accordion matching original TOC.astro) -->
      <th:block th:with="tocDesktopMode=${theme.config.general.toc_desktop_mode ?: 'collapsible'}, tocMobileMode=${theme.config.general.toc_mobile_mode ?: 'accordion'}">
        <div
          id="toc-container"
          th:classappend="${(tocDesktopMode == 'off' ? 'toc-desktop-off' : (tocDesktopMode == 'always' ? 'toc-desktop-always' : '')) + (tocMobileMode == 'sidebar' ? ' toc-mobile-sidebar' : (tocMobileMode == 'off' ? ' toc-mobile-off' : ''))}"
          class="mb-6 uno-round-border bg-secondary/5 2xl:fixed 2xl:left-0 2xl:top-44.5 2xl:max-w-[min(calc(50vw-38rem),13rem)] 2xl:border-none 2xl:bg-secondary/0"
          data-toc-pending
        >
          <!-- Checkbox toggle (always rendered for mobile accordion; desktop behavior controlled by CSS) -->
          <input type="checkbox" id="toc-toggle" class="toc-toggle-input" />

          <!-- Mobile header (always shown on mobile) + Desktop toggle icon (collapsible only) -->
          <div class="relative h-12 w-full" th:classappend="${tocDesktopMode != 'collapsible' ? 'toc-no-toggle' : ''}">
            <label
              for="toc-toggle"
              th:classappend="${tocDesktopMode != 'collapsible' ? '2xl:pointer-events-none' : ''}"
              class="absolute inset-0 flex cursor-pointer items-center 2xl:static 2xl:flex 2xl:c-secondary/60 2xl:transition-colors 2xl:ease-out 2xl:hover:c-primary"
            >
              <span id="toc-mobile-text" th:text="${t_toc}">TOC</span>
              <svg
                th:if="${tocDesktopMode == 'collapsible'}"
                id="toc-desktop-icon"
                aria-hidden="true"
                fill="currentColor"
                viewBox="0 0 24 24"
                class="ml-4 hidden aspect-square w-4.2 2xl:mt-4 2xl:block 2xl:origin-center 2xl:active:scale-90!"
              >
                <path d="M3 4H21V6H3V4ZM3 11H15V13H3V11ZM3 18H21V20H3V18Z" />
              </svg>
            </label>
          </div>

          <div id="toc-accordion-wrapper">
            <nav id="toc-accordion-content" th:aria-label="${t_toc}">
              <ul id="toc-links-list"></ul>
            </nav>
          </div>
        </div>
      </th:block>

      <!-- Mobile sidebar TOC: ribbon trigger + overlay -->
      <th:block th:with="tocMobileMode=${theme.config.general.toc_mobile_mode ?: 'accordion'}">
        <th:block th:if="${tocMobileMode == 'sidebar'}">
          <div id="toc-ribbon" class="toc-ribbon" role="button" tabindex="0" th:aria-label="${t_toc}" th:text="${t_toc}"></div>
          <div id="toc-overlay" class="toc-overlay">
            <div class="toc-overlay-content">
              <h2 class="toc-overlay-title" th:text="${t_toc}">目录</h2>
              <nav th:aria-label="${t_toc}">
                <ul id="toc-overlay-links"></ul>
              </nav>
            </div>
          </div>
        </th:block>
      </th:block>

      <!-- Content -->
      <div id="post-content">
        <div th:utext="${post.content.content}"></div>

        <!-- Copyright placeholder -->
        <div id="post-copyright"></div>

        <!-- Tag List -->
        <th:block th:if="${post.tags != null && !post.tags.isEmpty()}">
          <div class="mt-12.6 uno-decorative-line"></div>
          <div class="no-heti post-tags">
            <a
              th:each="tag : ${post.tags}"
              th:href="@{${tag.status.permalink}}"
              th:text="${tag.spec.displayName}"
            ></a>
          </div>
        </th:block>

        <!-- Comment -->
        <div class="mt-16">
          <halo:comment
            group="content.halo.run"
            kind="Post"
            th:name="${post.metadata.name}"
          ></halo:comment>
        </div>
      </div>

      <!-- Sync TOC population (runs before first paint, visually equivalent to SSR) -->
      <script>
        ;(function() {
          var content = document.getElementById('post-content');
          var container = document.getElementById('toc-container');
          var list = document.getElementById('toc-links-list');
          if (!content || !container || !list) return;
          // Detect if body content uses h1 — if so, include h1 in TOC
          var hasH1 = content.querySelector('h1') !== null;
          var selector = hasH1 ? 'h1, h2, h3, h4' : 'h2, h3, h4';
          var headings = content.querySelectorAll(selector);
          // Compute actual minimum heading level (handles h3-only posts etc.)
          var minLevel = 9;
          headings.forEach(function(h) {
            var lvl = parseInt(h.tagName[1], 10);
            if (lvl < minLevel) minLevel = lvl;
          });
          if (headings.length === 0) { container.style.display = 'none'; return; }
          var used = {};
          headings.forEach(function(h) {
            if (!h.id) {
              var base = h.textContent.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fff-]/g, '');
              var id = base || 'heading';
              var n = 1;
              while (used[id]) { id = base + '-' + n++; }
              h.id = id;
            }
            used[h.id] = true;
          });
          var subIndent = ['', 'ml-3', 'ml-6'];
          var frag = document.createDocumentFragment();
          var topLi = null;
          var groupUl = null;
          headings.forEach(function(h) {
            var depth = parseInt(h.tagName[1], 10);
            var indent = depth - minLevel;
            var a = document.createElement('a');
            a.href = '#' + h.id;
            a.textContent = h.textContent.trim();
            a.className = 'no-heti toc-links-h' + depth;
            if (indent === 0) {
              groupUl = null;
              topLi = document.createElement('li');
              topLi.appendChild(a);
              frag.appendChild(topLi);
            } else {
              if (!groupUl) {
                groupUl = document.createElement('ul');
                groupUl.className = 'toc-sub-group';
                if (topLi) { topLi.appendChild(groupUl); }
                else { var w = document.createElement('li'); w.appendChild(groupUl); frag.appendChild(w); }
              }
              var li = document.createElement('li');
              var rel = indent - 1;
              if (rel > 0 && rel < subIndent.length) li.className = subIndent[rel];
              li.appendChild(a);
              groupUl.appendChild(li);
            }
          });
          list.appendChild(frag);
          container.removeAttribute('data-toc-pending');
          // Also populate overlay TOC for sidebar mode
          var overlayList = document.getElementById('toc-overlay-links');
          if (overlayList) {
            var frag2 = document.createDocumentFragment();
            headings.forEach(function(h) {
              var depth = parseInt(h.tagName[1], 10);
              var li2 = document.createElement('li');
              var a2 = document.createElement('a');
              a2.href = '#' + h.id;
              a2.textContent = h.textContent.trim();
              a2.setAttribute('data-depth', String(depth));
              li2.appendChild(a2);
              frag2.appendChild(li2);
            });
            overlayList.appendChild(frag2);
          }
        })();
      </script>
    </article>
  </th:block>
</html>
