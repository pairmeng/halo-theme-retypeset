<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{modules/layout :: html(title = ${t_moments} + ' - ' + ${site.title}, content = ~{::content}, head = null, footer = null, sidebar = null, contentClass = '', isPostPage = false)}"
>
  <th:block th:fragment="content">
    <!-- Decorative Line -->
    <div class="uno-decorative-line"></div>

    <!-- Tag Filter -->
    <div th:if="${not #lists.isEmpty(tags)}" class="no-heti moment-tags">
      <span class="moment-tags-inner">
        <a
          href="/moments"
          th:class="${#lists.isEmpty(param.tag)} ? 'tag-active' : ''"
          th:text="${lang == 'en' ? 'All' : '全部'}"
        ></a>
        <a
          th:each="tag : ${tags}"
          th:href="|/moments?tag=${tag.name}|"
          th:classappend="${#lists.contains(param.tag, tag.name)} ? 'tag-active' : ''"
          th:text="${tag.name}"
        ></a>
      </span>
    </div>

    <!-- Moments List -->
    <div th:if="${moments.items.size() gt 0}">
      <article
        th:each="moment : ${moments.items}"
        th:with="content=${moment.spec.content}"
        class="moment-item"
      >
        <!-- Date -->
        <time
          class="moment-date"
          th:text="${#dates.format(moment.spec.releaseTime, 'yyyy-MM-dd HH:mm')}"
        ></time>

        <!-- Text Content -->
        <div
          th:if="${not #strings.isEmpty(content.html)}"
          class="moment-content heti"
          th:utext="${content.html}"
        ></div>

        <!-- Media -->
        <th:block th:if="${not #lists.isEmpty(content.medium)}">
          <div
            class="moment-media"
            th:attr="data-count=${#lists.size(content.medium)}"
          >
            <th:block th:each="item : ${content.medium}">
              <img
                th:if="${item.type.name == 'PHOTO'}"
                th:src="${item.url}"
                alt=""
                loading="lazy"
              />
              <video
                th:if="${item.type.name == 'VIDEO'}"
                th:src="${item.url}"
                controls
                preload="metadata"
              ></video>
              <audio
                th:if="${item.type.name == 'AUDIO'}"
                th:src="${item.url}"
                controls
                preload="metadata"
              ></audio>
            </th:block>
          </div>
        </th:block>
      </article>
    </div>

    <!-- Empty State -->
    <div th:if="${moments.items.size() == 0}" class="moment-empty">
      <span th:text="${lang == 'en' ? 'No moments yet' : '暂无瞬间'}"></span>
    </div>

    <!-- Pagination -->
    <nav
      th:if="${moments.hasPrevious() || moments.hasNext()}"
      class="mt-4 grid grid-cols-[1fr_auto_1fr] items-center font-navbar text-3.5 lg:mt-6"
    >
      <div>
        <a
          th:if="${moments.hasPrevious()}"
          th:href="@{${moments.prevUrl}}"
          class="highlight-hover py-0.8 c-secondary transition-colors after:bottom-0.35em hover:c-primary"
          th:text="${t_prev}"
        ></a>
      </div>
      <span class="c-secondary/60 font-time" th:text="${moments.page} + ' / ' + ${moments.totalPages}"></span>
      <div class="text-right">
        <a
          th:if="${moments.hasNext()}"
          th:href="@{${moments.nextUrl}}"
          class="highlight-hover py-0.8 c-secondary transition-colors after:bottom-0.35em hover:c-primary"
          th:text="${t_next}"
        ></a>
      </div>
    </nav>
  </th:block>
</html>
