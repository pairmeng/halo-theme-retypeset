<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{modules/layout :: html(title = (${theme.config.general.language == 'en' ? 'Categories' : '分类'}) + ' - ' + ${site.title}, content = ~{::content}, head = null, footer = null, sidebar = null, contentClass = '', isPostPage = false)}"
>
  <th:block th:fragment="content">
    <!-- Decorative Line -->
    <div class="uno-decorative-line"></div>

    <!-- Category List (vertical with dash prefix) -->
    <ul class="no-heti category-list">
      <li th:each="category : ${categories}">
        <a th:href="@{${category.status.permalink}}" th:text="${category.spec.displayName}"></a>
      </li>
    </ul>
  </th:block>
</html>
